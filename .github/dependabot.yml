version: 2
# Alerts are controlled in repository settings. This file cannot enable them.
# Security-update PRs and alerts are controlled separately in repository settings.
# The zero version-PR limit and ignore rule disable configured version-update PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: docker
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
