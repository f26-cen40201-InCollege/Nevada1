name: Resolve Dependabot issue

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: dependabot-resolve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.body == '/PR-RESOLVE' &&
      contains(github.event.issue.body, '<!-- incollege-dependabot-alert:') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare a draft fix and rerun the pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/resolve_dependabot_issue.py